<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Napoli Criminal Life</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#101214;font-family:system-ui,-apple-system,sans-serif;color:#fff}
#game{position:fixed;inset:0;background:#5d6f5a}canvas{width:100%;height:100%;display:block}
#hud{position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;font-weight:800;text-shadow:0 2px 3px #000}
#mission{position:absolute;top:56px;left:50%;transform:translateX(-50%);background:#000b;padding:9px 13px;border-radius:12px;max-width:90%;text-align:center;font-size:13px;pointer-events:none}
#dialog{position:absolute;left:5%;right:5%;bottom:115px;background:#101214ee;border:1px solid #ffffff22;border-radius:16px;padding:14px;display:none}
#dialog b{display:block;margin-bottom:6px}
#controls{position:absolute;left:18px;bottom:20px;width:150px;height:150px}
button{border:0;border-radius:14px;background:#000b;color:#fff;font-weight:800;min-width:48px;min-height:48px}
.pad{position:absolute;width:52px;height:52px;border-radius:50%}.up{left:49px;top:0}.left{left:0;top:49px}.right{right:0;top:49px}.down{left:49px;bottom:0}
#actions{position:absolute;right:18px;bottom:28px;display:flex;gap:9px;flex-direction:column}
#actions button{background:#000b}
#menu{position:absolute;right:12px;top:56px}
#menu button{background:#000b}
#overlay{position:absolute;inset:0;background:#0b0d0fee;display:flex;align-items:center;justify-content:center;padding:25px}
.panel{width:min(600px,94%);background:#181b1f;border:1px solid #ffffff1c;border-radius:20px;padding:24px;text-align:center}
.panel h1{margin:0 0 8px;font-size:30px}.panel p{color:#c9c9c9;line-height:1.45}
.panel button{width:100%;margin-top:10px;background:#e5c44b;color:#111}
.small{font-size:12px;color:#999}
</style>
</head>
<body>
<div id="game"><canvas id="c"></canvas>
<div id="hud"><span id="stats"></span><span id="time"></span></div>
<div id="mission"></div>
<div id="menu"><button id="save">SALVA</button></div>
<div id="dialog"><b id="speaker"></b><span id="text"></span><div style="margin-top:10px"><button id="choiceA"></button> <button id="choiceB"></button></div></div>
<div id="controls">
<button class="pad up" data-dy="-1">▲</button><button class="pad left" data-dx="-1">◀</button><button class="pad right" data-dx="1">▶</button><button class="pad down" data-dy="1">▼</button>
</div>
<div id="actions"><button id="run">CORRI</button><button id="interact">AZIONE</button></div>
<div id="overlay"><div class="panel"><h1>NAPOLI CRIMINAL LIFE</h1><p>Un open world originale ambientato in una Napoli immaginaria. La tua vita, le tue scelte, la tua strada.</p><button id="start">INIZIA LA STORIA</button><p class="small">Versione di sviluppo giocabile • nessun asset GTA</p></div></div>
</div>
<script>
(()=>{"use strict";
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),overlay=document.getElementById('overlay');
let W=1000,H=650,scale=1, keys={}, moving={x:0,y:0}, sprint=false, started=false;
const state={x:180,y:520,money:500,honest:0,street:0,wanted:0,mission:0,day:1,hour:8,energy:100,home:false};
const missions=[
["Il primo passo","Raggiungi il bar e parla con Nico.",300,2,0],
["Una scelta","Una borsa è stata lasciata sul marciapiede. Decidi cosa farne.",450,3,3],
["Il debito","Aiuta una commerciante a proteggere il suo negozio.",650,4,1],
["La consegna","Porta un pacco al porto. Evita guai.",900,0,5],
["Vecchi amici","Sara ha informazioni importanti. Incontrala al parco.",800,4,2],
["Il ponte","Due persone ti offrono strade diverse. Ascoltale.",1200,5,5],
["Pressione","Il quartiere è sotto pressione. Riduci il conflitto.",1500,5,6],
["La verità","Trova le prove e decidi se consegnarle.",1800,8,4],
["La notte più lunga","La resa dei conti cambia tutto.",2500,6,10],
["Un nuovo futuro","Scegli che persona vuoi diventare.",5000,10,10]
];
let target={x:780,y:520}, dialogue=null, cars=[];
function resize(){W=1000;H=650;cv.width=W;cv.height=H} resize(); addEventListener('resize',resize);
function road(y){return y>70&&y<130||y>300&&y<360||y>530&&y<590}
function setupCars(){cars=[];for(let i=0;i<7;i++)cars.push({x:80+i*145,y:[100,325,555][i%3],v:(i%2?1:-1)*(1.2+i%3*.5),vertical:false})}
setupCars();
function world(){ctx.fillStyle=night()?'#182022':'#65725e';ctx.fillRect(0,0,W,H);
 // blocks
 for(let r=0;r<3;r++)for(let col=0;col<5;col++){let x=20+col*195,y=145+r*175,w=160,h=125;
  ctx.fillStyle=['#a99b86','#8f8171','#b6a48c'][(r+col)%3];ctx.fillRect(x,y,w,h);
  for(let wx=x+18;wx<x+w-12;wx+=32)for(let wy=y+16;wy<y+h-12;wy+=30){ctx.fillStyle=night()?'#e4a84b':'#58646b';ctx.fillRect(wx,wy,14,10)}
 }
 // roads
 [100,330,560].forEach(y=>{ctx.fillStyle='#2c2e31';ctx.fillRect(0,y-30,W,60);ctx.strokeStyle='#d7c65a';ctx.setLineDash([22,16]);ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();ctx.setLineDash([])});
 // park
 ctx.fillStyle='#355b3a';ctx.fillRect(570,385,260,115);for(let i=0;i<14;i++){ctx.fillStyle='#477843';ctx.beginPath();ctx.arc(585+(i*41)%230,400+(i*31)%85,9,0,7);ctx.fill()}
 // port
 ctx.fillStyle='#43555d';ctx.fillRect(835,0,165,H);ctx.fillStyle='#30454d';for(let y=30;y<H;y+=55)ctx.fillRect(850,y,120,20);
 // landmark-inspired stepped buildings
 for(let side=0;side<2;side++){let bx=120+side*520;for(let l=0;l<4;l++){ctx.fillStyle='#80766c';ctx.fillRect(bx+l*12,25+l*28,190-l*24,20)}}
 // cars
 cars.forEach(c=>{c.x+=c.v;if(c.x>1040)c.x=-40;if(c.x<-40)c.x=1040;ctx.fillStyle='#1c2226';ctx.fillRect(c.x-18,c.y-9,36,18);ctx.fillStyle='#b8c7ca';ctx.fillRect(c.x-7,c.y-7,14,14)});
 // target
 if(target){ctx.strokeStyle='#f1d34d';ctx.lineWidth=4;ctx.beginPath();ctx.arc(target.x,target.y,23+Math.sin(Date.now()/180)*3,0,7);ctx.stroke()}
 // player
 ctx.fillStyle='#15191d';ctx.beginPath();ctx.arc(state.x,state.y,15,0,7);ctx.fill();ctx.fillStyle='#e0b28c';ctx.beginPath();ctx.arc(state.x,state.y-5,7,0,7);ctx.fill();
}
function night(){return state.hour>=20||state.hour<6}
function hud(){let m=missions[state.mission];document.getElementById('stats').textContent=`€ ${state.money}  •  ⭐ ${state.wanted}/5  •  Energia ${state.energy}`;document.getElementById('time').textContent=`Giorno ${state.day} • ${String(Math.floor(state.hour)).padStart(2,'0')}:00`;document.getElementById('mission').textContent=m?`MISSIONE ${state.mission+1}: ${m[0]} — ${m[1]}`:'CAMPAGNA COMPLETATA';}
function setTarget(){let pts=[[760,555],[400,325],[700,95],[900,330],[700,440],[300,325],[900,555],[250,100],[780,100],[500,560]];target={x:pts[state.mission][0],y:pts[state.mission][1]}}
function startMission(){if(state.mission<missions.length)setTarget();hud()}
function save(){localStorage.setItem('ncl',JSON.stringify(state));document.getElementById('save').textContent='SALVATO ✓';setTimeout(()=>document.getElementById('save').textContent='SALVA',1000)}
function load(){try{let s=JSON.parse(localStorage.getItem('ncl'));if(s)Object.assign(state,s)}catch(e){}}
function choice(){let m=missions[state.mission];dialogue=null;document.getElementById('dialog').style.display='none';state.money+=m[2];state.honest+=m[3];state.street+=m[4];if(m[4]>m[3])state.wanted=Math.min(5,state.wanted+1);else state.wanted=Math.max(0,state.wanted-1);state.mission++;save();if(state.mission<missions.length)startMission();else{target=null;hud();end();}}
function openDialogue(title,text,a,b){dialogue={title,text,a,b};document.getElementById('speaker').textContent=title;document.getElementById('text').textContent=text;document.getElementById('choiceA').textContent=a;document.getElementById('choiceB').textContent=b;document.getElementById('dialog').style.display='block'}
document.getElementById('choiceA').onclick=()=>choice();document.getElementById('choiceB').onclick=()=>choice();
document.getElementById('start').onclick=()=>{overlay.style.display='none';started=true;load();startMission()}
document.getElementById('save').onclick=save;
document.getElementById('run').onpointerdown=()=>sprint=true;document.getElementById('run').onpointerup=()=>sprint=false;document.getElementById('run').onpointerleave=()=>sprint=false;
document.querySelectorAll('.pad').forEach(b=>{let k=b.dataset;function on(){moving.x=+(k.dx||0);moving.y=+(k.dy||0)}function off(){moving.x=0;moving.y=0}b.onpointerdown=on;b.onpointerup=off;b.onpointercancel=off;b.onpointerleave=off});
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=0});
document.getElementById('interact').onclick=()=>{if(!started)return;let d=Math.hypot(state.x-target.x,state.y-target.y);if(d<70&&!dialogue&&state.mission<missions.length){let m=missions[state.mission];openDialogue(m[0],m[1],"Scelta A","Scelta B")}};
function end(){let diff=state.honest-state.street;let ending=diff>8?"FINALE ONESTO: costruisci un'attività e diventi un punto di riferimento per il quartiere.":diff<-8?"FINALE DELLA STRADA: ottieni potere e soldi, ma perdi molte persone importanti.":"FINALE LIBERO: crei una nuova vita scegliendo volta per volta chi vuoi essere.";openDialogue("EPILOGO",ending,"RICOMINCIA","Resta qui");document.getElementById('choiceA').onclick=()=>{localStorage.removeItem('ncl');location.reload()};document.getElementById('choiceB').onclick=()=>document.getElementById('dialog').style.display='none'}
let last=performance.now();function loop(now){let dt=Math.min(.04,(now-last)/1000);last=now;if(started&&!dialogue){let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);dx+=moving.x;dy+=moving.y;let l=Math.hypot(dx,dy)||1;let sp=sprint?220:130;state.x=Math.max(20,Math.min(W-20,state.x+dx/l*sp*dt));state.y=Math.max(20,Math.min(H-20,state.y+dy/l*sp*dt));state.hour+=dt*.7;if(state.hour>=24){state.hour-=24;state.day++;state.energy=100}state.energy=Math.max(0,state.energy-(sprint?5:1)*dt);if(target&&Math.hypot(state.x-target.x,state.y-target.y)<55){let m=missions[state.mission];if(m&&!dialogue)openDialogue(m[0],m[1],"Scelta A","Scelta B")}}world();hud();requestAnimationFrame(loop)}requestAnimationFrame(loop);
})();
</script>
</body></html>
